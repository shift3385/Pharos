# Dependabot (BASE-03, ADR-0021). Weekly, with minor/patch updates grouped per
# ecosystem so each week brings at most a few PRs; majors arrive one by one.
# A release must be 7 days old (14 for a major) before Dependabot proposes it,
# so a compromised release is usually pulled before it reaches us. Security
# updates skip the cooldown (enable "Dependabot security updates" in the
# repository settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: build(deps)
    groups:
      client-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: build(deps)
    groups:
      server-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: build(deps)
    groups:
      rust-minor-patch:
        update-types: [minor, patch]

  # Keeps the commit-SHA pins of every action current (with their version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
