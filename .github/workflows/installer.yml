# Windows installer as a CI artifact (BASE-09). NSIS for pre-releases, NSIS +
# MSI for stable versions (scripts/build-installer.mjs, VERSIONING §5).
# No caches here: a release artifact must not be built from a cache that
# another run could have written (cache poisoning).
name: Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: installer (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        working-directory: src-tauri
        run: rustup toolchain install
      - run: npm ci
      - run: npm run build:installer -- --ci
      - name: Artifact name
        id: meta
        shell: bash
        run: echo "name=pharos-$(node -p "require('./package.json').version")-${GITHUB_SHA::7}-windows" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
