        onS: (e) => this._draft(x.id + 's', e.target.value), onE: (e) => this._draft(x.id + 'e', e.target.value),
        onSBlur: (e) => this._commit(x.id + 's', e.target.value, (v) => { const q = this.state.sprints.find((z) => z.id === x.id); if (v > q.end) return 'El inicio es posterior al fin.'; this._updS(x.id, { start: v }); this._jump(v); return true; }),
        onEBlur: (e) => this._commit(x.id + 'e', e.target.value, (v) => { const q = this.state.sprints.find((z) => z.id === x.id); if (v < q.start) return 'El fin es anterior al inicio.'; this._updS(x.id, { end: v }); this._jump(v); return true; }),
        onDel: () => this.setState((q) => ({ sprints: q.sprints.filter((z) => z.id !== x.id), sel: q.sel === x.id ? null : q.sel, hl: null })),
        onEnter: () => { if (this.state.hl !== x.id) { this.setState({ hl: x.id }); this._jump(x.start); } },
        onLeave: () => this.setState({ hl: null })
      };
    });
    const hs = [...s.hitos].sort((a, b) => (a.date < b.date ? -1 : 1));
    const hitoRows = hs.map((h) => {
      const b = s.bad[h.id + 'd'];
      return {
        name: h.name, dVal: s.drafts[h.id + 'd'] ?? F(h.date), onKey, row: rowBox(s.sel === h.id || s.hl === h.id),
        dStyle: { ...inS(b), flex: '0 1 140px' }, hasMsg: !!b, msg: b || '',
        onName: (e) => this._updH(h.id, { name: e.target.value }), onD: (e) => this._draft(h.id + 'd', e.target.value),
        onDBlur: (e) => this._commit(h.id + 'd', e.target.value, (v) => { this._updH(h.id, { date: v }); this._jump(v); return true; }),
        onDel: () => this.setState((q) => ({ hitos: q.hitos.filter((z) => z.id !== h.id), sel: q.sel === h.id ? null : q.sel, hl: null })),
        onEnter: () => { if (this.state.hl !== h.id) { this.setState({ hl: h.id }); this._jump(h.date); } },
        onLeave: () => this.setState({ hl: null })
      };
    });
    const last = sp.length ? sp.reduce((m, x) => (x.end > m ? x.end : m), sp[0].end) : today;
    const nStart = add(last, 1), nEnd = add(nStart, DUR - 1);
    const seg = (on) => ({ height: 32, display: 'inline-flex', alignItems: 'center', gap: 6, padding: '0 12px', border: 0, borderRadius: 8, font: 'inherit', fontSize: 13, fontWeight: on ? 600 : 500, cursor: 'pointer', background: on ? 'var(--color-surface-1)' : 'transparent', color: on ? 'var(--color-navy-500)' : 'var(--color-text-secondary)', boxShadow: on ? 'var(--shadow-1)' : 'none' });
    const hint = s.anchor ? 'Inicio: ' + F(s.anchor) + '. Haz clic en el día de fin. Esc para cancelar.'
      : s.mode === 'hito' ? 'Haz clic en un día para añadir un hito. Haz clic en un hito para seleccionarlo.'
      : 'Haz clic en el día de inicio y después en el de fin para crear un sprint.' + (mobile ? '' : ' Selecciona un sprint y arrastra sus extremos para cambiar las fechas.');
    return {
      rootRef: this._rootCb, months, hint, sprintRows, hitoRows,
      isSprint: s.mode === 'sprint', isHito: s.mode === 'hito', segSprint: seg(s.mode === 'sprint'), segHito: seg(s.mode === 'hito'),
      setSprint: () => this.setState({ mode: 'sprint' }), setHito: () => this.setState({ mode: 'hito', anchor: null, hover: null }),
      prevMonth: () => this.setState((q) => { const d = new Date(q.vy, q.vm - 1, 1); return { vy: d.getFullYear(), vm: d.getMonth() }; }),
      nextMonth: () => this.setState((q) => { const d = new Date(q.vy, q.vm + 1, 1); return { vy: d.getFullYear(), vm: d.getMonth() }; }),
      nextTitle: 'Añade ' + this._nextName() + ': ' + F(nStart) + ' – ' + F(nEnd) + ' (14 días, paso 6)',
      nextSprint: () => { this._addSprint(nStart, nEnd); this._jump(nStart); },
      sprintCount: sp.length + (sp.length === 1 ? ' sprint' : ' sprints'), hitoCount: hs.length + (hs.length === 1 ? ' hito' : ' hitos'),
      noSprints: sp.length === 0, noHitos: hs.length === 0
    };
  }
}
</script>
