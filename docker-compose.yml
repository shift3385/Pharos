# Backend orchestration for Pharos (spec §2, §14.2). Reuses the postgres:15-alpine
# image already present on the machine (no new image pull); the client desktop app
# is installed natively and is NOT dockerized.
name: pharos

services:
  db:
    image: postgres:15-alpine
    container_name: pharos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pharos_db}
    ports:
      # Host 5433 to avoid clashing with any other local postgres on 5432.
      - "5433:5432"
    volumes:
      - pharos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pharos_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production mode: the API refuses to start until .env sets a real
  # JWT_ACCESS_SECRET (32+ chars) and an explicit CORS_ORIGIN (README,
  # "Production configuration"). `docker compose up -d db` alone is unaffected.
  api:
    build: ./server
    container_name: pharos-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pharos_db}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-insecure-secret-change-me-please-min32}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Only the caddy service below reaches the API (its port is not
      # published), so the protocol and client IP come from Caddy's
      # X-Forwarded-* headers (SEC-07, docs/despliegue.md).
      TRUST_PROXY: ${TRUST_PROXY:-true}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      LOGIN_RATE_LIMIT_WINDOW: ${LOGIN_RATE_LIMIT_WINDOW:-1 minute}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-1048576}
      SYNC_BODY_LIMIT_BYTES: ${SYNC_BODY_LIMIT_BYTES:-8388608}
      # IA-12 (ADR-0034): empty = AI on the web is off.
      AI_VAULT_KEY: ${AI_VAULT_KEY:-}
    # No published port: in production the API serves only https, through
    # Caddy (SEC-07). It still listens on 3000 inside the compose network.
    expose:
      - "3000"

  # Ends TLS for the API (SEC-07, ADR-0046, docs/despliegue.md). With a public
  # domain in PHAROS_DOMAIN it gets a Let's Encrypt certificate; with
  # localhost or an internal name it uses its own CA, which Windows must trust.
  caddy:
    image: caddy:2-alpine
    container_name: pharos-caddy
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PHAROS_DOMAIN: ${PHAROS_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pharos_pg_data:
  caddy_data:
  caddy_config:
