[package]
name = "pharos"
version = "0.2.0-alpha.1"
description = "Pharos — QA test management suite"
authors = ["Pharos"]
edition = "2021"
rust-version = "1.77.2"
publish = false

# The library is what the desktop and (future) mobile entrypoints call into.
# Desktop only needs the rlib: the binary (main.rs) links it.
# The cdylib/staticlib are mobile artifacts (0.4.0). Under the former GNU
# toolchain, MinGW's BFD ld failed to link them with windows-rs ("export
# ordinal too large"); the MSVC toolchain does not have that limit. Re-add
# ["staticlib", "cdylib"] when the mobile target is set up.
[lib]
name = "pharos_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Secure session cache in the Windows Credential Manager (spec §4).
keyring = { version = "3", features = ["windows-native"] }
# Local encrypted SQLite: plain SQLite (compiles with gcc, no OpenSSL) + pure-Rust
# AES-256-GCM encryption at rest, key kept in the OS keychain (spec §16 Phase 2).
# `serialize` moves the database image to/from memory so plaintext never hits disk;
# `blob` reads the old planner attachment BLOBs in blocks while moving them out.
rusqlite = { version = "0.32", features = ["bundled", "serialize", "blob"] }
# `stream`: the evidence files (`evidence/*.pev`, ADR-0014) are encrypted and
# decrypted in 64 KiB blocks (STREAM construction), never whole in memory.
aes-gcm = { version = "0.10", features = ["stream"] }
# Evidence keys and file names (ADR-0014): HKDF-SHA256 derives them from the
# database key; HMAC-SHA256 of the content hash names each file.
hkdf = "0.12"
hmac = "0.12"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Online AI provider calls (Gemini). Reuse the reqwest version already in the
# tree; default TLS avoids OpenSSL (originally required by the GNU toolchain —
# see the Phase 2 spike). `json` for request/response bodies.
reqwest = { version = "0.13", features = ["json"] }
# Observability (BASE-08, ADR-0022): structured JSON-lines logs in a daily
# rotating file under the app log dir; `log` records from Tauri are bridged in.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# Diagnostic bundle: OS name/version and redaction of secrets in exported logs.
os_info = { version = "3", default-features = false }
regex = "1"
# Checksum of the recovery key (SEC-03, ADR-0024); already in the tree via Tauri.
sha2 = "0.10"

# Native folder picker for the download folder (UX-02), called only from Rust
# (downloads.rs): no dialog plugin, so the webview gets no dialog permission.
# Windows only (the shipped target): rfd uses the system dialog through COM, and
# its default features (gtk3/Wayland) only matter on Linux.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }

[dev-dependencies]
# Generated TS contracts (BASE-05, ADR-0026): the derives are test-only, so
# cargo test writes src/shared/contracts/generated/ and the binary never
# carries ts-rs. Settings in .cargo/config.toml.
ts-rs = "12"

[features]
# This feature is used to produce production builds where an extra console
# window is not spawned on Windows. Enabled by `tauri build`.
custom-protocol = ["tauri/custom-protocol"]
