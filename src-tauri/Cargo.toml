[package]
name = "pharos"
version = "0.5.0-beta.1"
description = "Pharos — QA test management suite"
authors = ["Pharos"]
edition = "2021"
rust-version = "1.77.2"
publish = false
# The workspace has two binaries among its default members: this one (the
# desktop app) and `pharos-cli` (INT-01). `tauri dev` runs a plain `cargo run`,
# and Tauri reads this key to know which binary is the app.
default-run = "pharos"

# Two crates share `src-tauri/src` (CORE-01, ADR-0050):
# - `pharos-core` (core/Cargo.toml, rooted at src/lib.rs): the database,
#   migrations, repositories, oplog and sync, with no Tauri unless its `tauri`
#   feature is on. The desktop and the CLI (INT-01) both use it.
# - this package, `pharos`: the desktop shell (src/app.rs and src/main.rs),
#   which builds the Tauri app and registers the core's commands.
[workspace]
members = [".", "core", "sqlite3mc-sys", "cli"]
default-members = [".", "core", "sqlite3mc-sys", "cli"]

# The library is what the desktop and (future) mobile entrypoints call into.
# Desktop only needs the rlib: the binary (main.rs) links it.
# The cdylib/staticlib are mobile artifacts (0.4.0). Under the former GNU
# toolchain, MinGW's BFD ld failed to link them with windows-rs ("export
# ordinal too large"); the MSVC toolchain does not have that limit. Re-add
# ["staticlib", "cdylib"] when the mobile target is set up.
[lib]
name = "pharos_lib"
path = "src/app.rs"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pharos-core = { path = "core", features = ["tauri"] }
tauri = { version = "2", features = [] }
tracing = "0.1"

[features]
# This feature is used to produce production builds where an extra console
# window is not spawned on Windows. Enabled by `tauri build`.
custom-protocol = ["tauri/custom-protocol"]
