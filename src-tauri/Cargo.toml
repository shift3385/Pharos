[package]
name = "pharos"
version = "0.0.1"
description = "Pharos — QA test management suite"
authors = ["Pharos"]
edition = "2021"
rust-version = "1.77.2"

# The library is what the desktop and (future) mobile entrypoints call into.
[lib]
name = "pharos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# This feature is used to produce production builds where an extra console
# window is not spawned on Windows. Enabled by `tauri build`.
custom-protocol = ["tauri/custom-protocol"]
