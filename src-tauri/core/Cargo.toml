[package]
name = "pharos-core"
version = "0.5.0-beta.1"
description = "Pharos core: local database, migrations, repositories, oplog and sync (CORE-01, ADR-0050)"
authors = ["Pharos"]
edition = "2021"
rust-version = "1.77.2"
publish = false

# The sources are the ones the desktop always had, in `src-tauri/src`; this
# manifest only gives them a crate of their own (CORE-01, ADR-0050). The
# desktop shell (`src-tauri/src/app.rs`, the `pharos` package) builds it with
# the `tauri` feature; the CLI (INT-01) builds it without, so it never compiles
# Tauri.
[lib]
name = "pharos_core"
path = "../src/lib.rs"
crate-type = ["rlib"]

[features]
# The #[tauri::command] wrappers and the few helpers that take Tauri types.
tauri = ["dep:tauri", "dep:rfd"]
# `api::open_with_key` for the CLI's tests (INT-01): a database opened with a
# key of the test's own, never the user's `db-key`. Never in a release build.
test-support = []

[dependencies]
# Optional: only the desktop shell enables it (feature `tauri`).
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse floats exactly, so the JCS hash of a case revision
# (DAT-02) matches the one JavaScript computes for the same JSON.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Secure session cache in the Windows Credential Manager (spec §4).
keyring = { version = "3", features = ["windows-native"] }
# Local SQLite on disk, encrypted per page (SEC-05, ADR-0050): SQLite3 Multiple
# Ciphers in the SQLCipher 4 scheme, compiled by pharos-sqlite3mc-sys. With
# `in_gecko`, libsqlite3-sys uses its bundled bindings and links nothing, so
# that static library is the SQLite of the process (SEC-04 spike).
# `serialize` reads the image of a pre-0.6 `pharos.db.enc` to convert it;
# `backup` copies the encrypted database to its backups; `blob` reads the old
# planner attachment BLOBs in blocks while moving them out.
rusqlite = { version = "0.41.1", features = ["in_gecko", "serialize", "blob", "backup"] }
pharos-sqlite3mc-sys = { path = "../sqlite3mc-sys" }
# `stream`: the evidence files (`evidence/*.pev`, ADR-0014) are encrypted and
# decrypted in 64 KiB blocks (STREAM construction), never whole in memory.
aes-gcm = { version = "0.10", features = ["stream"] }
# Evidence keys and file names (ADR-0014): HKDF-SHA256 derives them from the
# database key; HMAC-SHA256 of the content hash names each file.
hkdf = "0.12"
hmac = "0.12"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v5"] }
# RFC 8785 (JCS) numbers in ECMAScript form, for the content hash of a case
# revision (DAT-02, ADR-0011): the server hashes the same JSON in JavaScript.
ryu-js = "1"
# Online AI provider calls (Gemini). Reuse the reqwest version already in the
# tree; default TLS avoids OpenSSL (originally required by the GNU toolchain —
# see the Phase 2 spike). `json` for request/response bodies.
reqwest = { version = "0.13", features = ["json"] }
# Parses and checks the server address picked at sign-in (SEC-10, ADR-0046);
# already in the tree through reqwest and Tauri.
url = "2"
# Observability (BASE-08, ADR-0022): structured JSON-lines logs in a daily
# rotating file under the app log dir; `log` records from Tauri are bridged in.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# Diagnostic bundle: OS name/version and redaction of secrets in exported logs.
os_info = { version = "3", default-features = false }
regex = "1"
# Checksum of the recovery key (SEC-03, ADR-0024); already in the tree via Tauri.
sha2 = "0.10"
# Walks a project folder for the AI requirement extraction (IA-17, ADR-0036),
# honouring .gitignore; MIT OR Unlicense, by the author of ripgrep.
ignore = "0.4"

# Native folder picker for the download folder (UX-02), called only from Rust
# (downloads.rs): no dialog plugin, so the webview gets no dialog permission.
# Windows only (the shipped target): rfd uses the system dialog through COM, and
# its default features (gtk3/Wayland) only matter on Linux.
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false, optional = true }

[dev-dependencies]
# Generated TS contracts (BASE-05, ADR-0026): the derives are test-only, so
# cargo test writes src/shared/contracts/generated/ and the binary never
# carries ts-rs. Settings in .cargo/config.toml.
ts-rs = "12"
# `trace`: tests count the SQL statements a piece of work runs, so a
# performance guard holds under any CPU load (BASE-25); test builds only.
rusqlite = { version = "0.41.1", features = ["trace"] }
# The unit tests also call the command wrappers: `cargo test -p pharos-core`
# builds with Tauri, while `cargo check -p pharos-core` (the CLI's view) does not.
pharos-core = { path = ".", features = ["tauri"] }
